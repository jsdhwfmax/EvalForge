name: EvalForge quality gate
description: Enforce evaluator-neutral AI quality policies and emit JSON, JUnit, and SARIF evidence.
author: EvalForge Contributors

branding:
  icon: check-circle
  color: teal

inputs:
  candidate:
    description: Path to a candidate EvalForge artifact or flat JSON metric summary.
    required: true
  policy:
    description: Path to an EvalForge gate policy.
    required: true
  baseline:
    description: Optional path to a baseline artifact for delta checks.
    required: false
    default: ""
  python-version:
    description: Python version used by the action.
    required: false
    default: "3.12"
  json-output:
    description: JSON gate report path.
    required: false
    default: evalforge-report.json
  junit-output:
    description: JUnit XML report path.
    required: false
    default: evalforge-junit.xml
  sarif-output:
    description: SARIF 2.1.0 report path.
    required: false
    default: evalforge.sarif
  markdown-output:
    description: Markdown gate summary path.
    required: false
    default: evalforge-summary.md
  job-summary:
    description: Append the Markdown report to the GitHub job summary, including on failure.
    required: false
    default: "true"

outputs:
  exit-code:
    description: Gate exit code (0 pass, 1 blocked, 2 invalid input).
    value: ${{ steps.gate.outputs.exit-code }}
  json-report:
    description: Path to the JSON report.
    value: ${{ inputs.json-output }}
  markdown-report:
    description: Path to the Markdown summary.
    value: ${{ inputs.markdown-output }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install EvalForge
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Enforce evaluation policy
      id: gate
      shell: bash
      env:
        EVALFORGE_CANDIDATE: ${{ inputs.candidate }}
        EVALFORGE_POLICY: ${{ inputs.policy }}
        EVALFORGE_BASELINE: ${{ inputs.baseline }}
        EVALFORGE_JSON: ${{ inputs.json-output }}
        EVALFORGE_JUNIT: ${{ inputs.junit-output }}
        EVALFORGE_SARIF: ${{ inputs.sarif-output }}
        EVALFORGE_MARKDOWN: ${{ inputs.markdown-output }}
        EVALFORGE_JOB_SUMMARY: ${{ inputs.job-summary }}
      run: |
        path_status=0
        python - <<'PY' || path_status=$?
        import os
        import sys
        from pathlib import Path

        def same_file(left, right):
            return left.resolve() == right.resolve() or (
                left.exists() and right.exists() and left.samefile(right)
            )

        try:
            output_keys = (
                "EVALFORGE_JSON", "EVALFORGE_JUNIT",
                "EVALFORGE_SARIF", "EVALFORGE_MARKDOWN",
            )
            outputs = [Path(os.environ[key]) for key in output_keys]
            protected = [
                Path(os.environ[key])
                for key in (
                    "EVALFORGE_CANDIDATE", "EVALFORGE_POLICY", "EVALFORGE_BASELINE",
                    "GITHUB_OUTPUT", "GITHUB_STEP_SUMMARY",
                )
                if os.environ.get(key)
            ]
            for index, output in enumerate(outputs):
                if output.is_dir():
                    raise ValueError("report output is a directory: %r" % str(output))
                for source in protected:
                    if same_file(output, source) or source.resolve() in output.resolve().parents:
                        raise ValueError("report output overlaps a protected input: %r" % str(output))
                for other in outputs[:index]:
                    if (same_file(output, other)
                            or output.resolve() in other.resolve().parents
                            or other.resolve() in output.resolve().parents):
                        raise ValueError("report outputs overlap: %r" % str(output))
                if any(parent.exists() and not parent.is_dir() for parent in output.parents):
                    raise ValueError("report parent is not a directory: %r" % str(output))
            # Validate every destination before removing any previous report.
            for output in outputs:
                output.unlink(missing_ok=True)
        except (OSError, RuntimeError, ValueError) as exc:
            print("Invalid report destination: %s" % exc, file=sys.stderr)
            raise SystemExit(2)
        PY
        if [[ "$path_status" -ne 0 ]]; then
          echo "exit-code=2" >> "$GITHUB_OUTPUT"
          exit 2
        fi
        args=("$EVALFORGE_CANDIDATE" --policy "$EVALFORGE_POLICY")
        if [[ -n "$EVALFORGE_BASELINE" ]]; then
          args+=(--baseline "$EVALFORGE_BASELINE")
        fi
        report_dir=$(mktemp -d)
        trap 'rm -rf "$report_dir"' EXIT
        gate_status=0
        evalforge gate "${args[@]}" \
          --json "$report_dir/report.json" \
          --junit "$report_dir/junit.xml" \
          --sarif "$report_dir/report.sarif" \
          --markdown "$report_dir/summary.md" || gate_status=$?
        echo "exit-code=$gate_status" >> "$GITHUB_OUTPUT"
        if [[ "$gate_status" -le 1 && -f "$report_dir/report.json" && -f "$report_dir/junit.xml" \
              && -f "$report_dir/report.sarif" && -f "$report_dir/summary.md" ]]; then
          sources=(report.json junit.xml report.sarif summary.md)
          destinations=("$EVALFORGE_JSON" "$EVALFORGE_JUNIT" "$EVALFORGE_SARIF" "$EVALFORGE_MARKDOWN")
          for index in "${!sources[@]}"; do
            mkdir -p -- "$(dirname -- "${destinations[$index]}")"
            cp -- "$report_dir/${sources[$index]}" "${destinations[$index]}"
          done
          if [[ "$EVALFORGE_JOB_SUMMARY" == "true" ]]; then
            cat "$report_dir/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
        exit "$gate_status"
