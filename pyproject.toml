[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge-ci"
version = "0.2.1"
description = "Portable evaluation evidence and policy gates for RAG and AI assistants"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "EvalForge Contributors"}]
keywords = ["rag", "llm", "evaluation", "quality-gates", "sarif", "junit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
rag = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]
dashboard = ["pandas>=2.0,<3", "plotly>=5.22,<7", "streamlit>=1.37,<2"]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "jsonschema>=4.23,<5",
  "mypy>=1.11,<3",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
evalforge = "evalforge.cli:app"

[project.urls]
Homepage = "https://github.com/jsdhwfmax/EvalForge"
Documentation = "https://github.com/jsdhwfmax/EvalForge#readme"
Issues = "https://github.com/jsdhwfmax/EvalForge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evalforge = ["py.typed"]

[tool.setuptools.data-files]
"share/evalforge/schemas" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.coverage.run]
source = ["evalforge"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = true
