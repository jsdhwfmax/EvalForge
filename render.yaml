envVarGroups:
  - name: evalforge-shared
    envVars:
      - key: EVALFORGE_ENVIRONMENT
        value: production
      - key: EVALFORGE_ACCESS_KEY
        generateValue: true

databases:
  - name: evalforge-db
    databaseName: evalforge
    user: evalforge
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: evalforge-api
    runtime: docker
    plan: starter
    dockerCommand: python -m evalforge.server api
    healthCheckPath: /health
    envVars:
      - fromGroup: evalforge-shared
      - key: EVALFORGE_DATABASE_URL
        fromDatabase:
          name: evalforge-db
          property: connectionString

  - type: web
    name: evalforge-dashboard
    runtime: docker
    plan: starter
    dockerCommand: python -m evalforge.server dashboard
    healthCheckPath: /_stcore/health
    envVars:
      - fromGroup: evalforge-shared
      - key: EVALFORGE_API_BASE_URL
        fromService:
          type: web
          name: evalforge-api
          property: hostport
